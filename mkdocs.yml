site_name: Sake Documentation
site_description: Documentation for the Sake machine-learning framework for budget execution, statistical analysis, visualization, and model benchmarking.
site_author: Terry D. Eppler
site_url: https://is-leeroy-jenkins.github.io/Sake/

repo_url: https://github.com/is-leeroy-jenkins/Sake
repo_name: is-leeroy-jenkins/Sake

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - toc.follow
  palette:
    - scheme: slate
      primary: blue
      accent: blue
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/css/sake.css

extra_javascript:
  - assets/js/sake.js

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Data Sources: data-sources.md
  - Model Evaluation: model-evaluation.md
  - User Guide:
      - Overview: user-guide/index.md
      - Installation: user-guide/installation.md
      - Data Loading: user-guide/data-loading.md
      - Data Overview: user-guide/data-overview.md
      - Descriptive Statistics: user-guide/descriptive-statistics.md
      - Inferential Statistics: user-guide/inferential-statistics.md
      - Feature Engineering: user-guide/feature-engineering.md
      - Classification: user-guide/classification.md
      - Regression: user-guide/regression.md
      - Visualization: user-guide/visualization.md
      - Streamlit App: user-guide/streamlit-app.md
  - API Reference:
      - Overview: api/index.md
      - Application: api/app.md
      - Data: api/data.md
      - Statistics: api/statistics.md
      - Features: api/features.md
      - Models: api/models.md
      - Evaluation: api/evaluation.md
      - Visualization: api/visualization.md
      - Utilities: api/utilities.md
  - Development: development.md